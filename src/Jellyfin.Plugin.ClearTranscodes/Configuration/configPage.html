<!DOCTYPE html>
<html>
<head>
    <title>Clear Transcodes</title>
</head>
<body>
    <div id="ClearTranscodesConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
         data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="ClearTranscodesConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel" for="MaxAgeHours">Max file age (hours)</label>
                        <input id="MaxAgeHours" name="MaxAgeHours" type="number" is="emby-input" min="1" />
                        <div class="fieldDescription">
                            Files in the transcode temp directory older than this will be deleted
                            when the "Clear Transcode Directory" scheduled task runs.
                        </div>
                    </div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var ClearTranscodesConfig = {
                pluginUniqueId: 'c3cbb73c-59e6-4ec6-9cba-a86ba70e73c0'
            };

            document.querySelector('#ClearTranscodesConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(ClearTranscodesConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#MaxAgeHours').value = config.MaxAgeHours;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#ClearTranscodesConfigForm')
                .addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(ClearTranscodesConfig.pluginUniqueId).then(function (config) {
                        config.MaxAgeHours = Number(document.querySelector('#MaxAgeHours').value);
                        ApiClient.updatePluginConfiguration(ClearTranscodesConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });
                    return false;
                });
        </script>
    </div>
</body>
</html>
